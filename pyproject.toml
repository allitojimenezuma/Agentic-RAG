[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG system with persistent LLM-maintained wiki"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "markitdown[all]>=0.0.1",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "langchain-deepseek>=1.1.0",
    "rank-bm25>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
ui = ["streamlit>=1.40"]

[project.scripts]
agentic-rag = "agentic_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "deepeval>=4.1.5",
    "litellm>=1.95.0",
]
